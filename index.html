<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة اختبار ويب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .test-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-message {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 صفحة اختبار ويب</h1>
        <p>هذه صفحة اختبار تفاعلية بسيطة. املأ النموذج أدناه واضغط على زر الإرسال لاختبار الوظائف.</p>
        
        <form class="test-form" id="testForm">
            <input type="text" id="nameInput" placeholder="أدخل اسمك هنا" required>
            <textarea id="messageInput" placeholder="اكتب رسالتك هنا..." required></textarea>
            <button type="submit">إرسال الاختبار</button>
        </form>

        <div class="result" id="result">
            <p class="success-message">✅ تم إرسال البيانات بنجاح!</p>
            <p id="resultData"></p>
        </div>
    </div>

    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('nameInput').value;
            const message = document.getElementById('messageInput').value;
            const resultDiv = document.getElementById('result');
            const resultData = document.getElementById('resultData');
            
            // محاكاة معالجة البيانات
            resultData.innerHTML = `
                <strong>الاسم:</strong> ${name}<br>
                <strong>الرسالة:</strong> ${message}<br>
                <strong>التوقيت:</strong> ${new Date().toLocaleString('ar-SA')}
            `;
            
            resultDiv.classList.add('show');
            
            // إعادة تعيين النموذج بعد ثانيتين
            setTimeout(() => {
                document.getElementById('testForm').reset();
                resultDiv.classList.remove('show');
            }, 5000);
        });

        // إضافة تأثير بسيط عند تحميل الصفحة
        window.addEventListener('load', () => {
            console.log('✅ صفحة الاختبار جاهزة للاستخدام!');
        });
    </script>
</body>
</html>
