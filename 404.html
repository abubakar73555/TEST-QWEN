<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة غير موجودة - 404 | شركة سلامة</title>
    <meta name="description" content="الصفحة التي تبحث عنها غير موجودة أو تم نقلها">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f9fafb 0%, #e5e7eb 100%);
        }
        .error-content {
            max-width: 600px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">عذراً، الصفحة غير موجودة</h1>
            <p class="error-message">
                يبدو أن الصفحة التي تبحث عنها قد تم نقلها أو حذفها أو أنها غير موجودة أصلاً.
                <br>
                يرجى التحقق من الرابط أو العودة إلى الصفحة الرئيسية.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn-primary btn-large">العودة للرئيسية</a>
                <a href="contact.html" class="btn-secondary btn-large">اتصل بنا</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
